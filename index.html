<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Talento Humano · LUTEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div id="demo" class="demo" hidden>MODO DEMO — los datos se guardan solo en este navegador. Configura <code>config.js</code> para usar Firebase.</div>

<section id="login" class="login" hidden>
  <form id="f-login" class="login-box">
    <h1>Talento Humano</h1>
    <p class="muted">LUTEC · acceso exclusivo Recursos Humanos</p>
    <label>Correo<input name="email" type="email" autocomplete="username" required></label>
    <label>Clave<input name="clave" type="password" autocomplete="current-password" required></label>
    <button class="btn primary">Entrar</button>
    <button type="button" class="link" data-act="resetClave">Olvidé mi clave</button>
    <p id="login-err" class="err"></p>
  </form>
</section>

<div id="app" class="app" hidden>
  <nav class="nav">
    <div class="marca">LUTEC<small>Talento Humano</small></div>
    <button data-act="ir" data-v="tablero">Tablero</button>
    <button data-act="ir" data-v="directorio">Colaboradores</button>
    <button data-act="ir" data-v="indicadores">Indicadores</button>
    <button data-act="ir" data-v="vacaciones">Vacaciones</button>
    <button data-act="ir" data-v="importar">Importar Excel</button>
    <button data-act="ir" data-v="ajustes">Ajustes</button>
    <div class="nav-pie">
      <button id="btn-drive" data-act="drive">Conectar Drive</button>
      <span id="usuario" class="muted"></span>
      <button data-act="salir">Salir</button>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>
</body>
</html>
